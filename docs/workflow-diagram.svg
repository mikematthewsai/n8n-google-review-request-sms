<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google review request workflow</title>
  <desc id="desc">A job complete webhook is validated, delayed outside quiet hours, checked for duplicates in Twilio, then sent with an owner status update.</desc>
  <rect width="1200" height="630" fill="#0b1020"/>
  <text x="70" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">One review request. Never twice. Never at night.</text>
  <text x="70" y="112" fill="#a9b4cc" font-family="Arial, sans-serif" font-size="20">A database-free n8n workflow using Twilio as the delivery record</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/></filter>
  </defs>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="65" y="205" width="180" height="110" rx="18" fill="#172033" stroke="#3b82f6" stroke-width="2"/>
    <text x="155" y="248" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Job complete</text>
    <text x="155" y="278" text-anchor="middle" fill="#a9b4cc" font-size="16">Webhook event</text>

    <rect x="285" y="205" width="180" height="110" rx="18" fill="#172033" stroke="#22c55e" stroke-width="2"/>
    <text x="375" y="248" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Validate</text>
    <text x="375" y="278" text-anchor="middle" fill="#a9b4cc" font-size="16">Phone + settings</text>

    <rect x="505" y="205" width="180" height="110" rx="18" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
    <text x="595" y="244" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Plan send</text>
    <text x="595" y="273" text-anchor="middle" fill="#a9b4cc" font-size="16">Delay + quiet hours</text>

    <rect x="725" y="205" width="180" height="110" rx="18" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <text x="815" y="244" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Check Twilio</text>
    <text x="815" y="273" text-anchor="middle" fill="#a9b4cc" font-size="16">90-day dedupe</text>

    <rect x="945" y="205" width="190" height="110" rx="18" fill="#172033" stroke="#ec4899" stroke-width="2"/>
    <text x="1040" y="244" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Send once</text>
    <text x="1040" y="273" text-anchor="middle" fill="#a9b4cc" font-size="16">Review link by SMS</text>
  </g>
  <g stroke="#7dd3fc" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M245 260 H280"/><path d="M465 260 H500"/><path d="M685 260 H720"/><path d="M905 260 H940"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="215" y="410" width="770" height="118" rx="20" fill="#101827" stroke="#334155" stroke-width="2"/>
    <text x="600" y="450" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Owner visibility at every exit</text>
    <text x="600" y="485" text-anchor="middle" fill="#a9b4cc" font-size="18">Sent  •  Already asked  •  Bad input  •  Twilio failure with provider reason</text>
    <text x="600" y="515" text-anchor="middle" fill="#7dd3fc" font-size="16">No AI model  •  No spreadsheet  •  No separate database  •  No review gating</text>
  </g>
  <text x="70" y="592" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Built and verified by Mike Matthews · Matthews Automation</text>
</svg>

